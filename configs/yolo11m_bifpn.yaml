# ROVOROAD Pothole Detection - YOLO11m + BiFPN Model Config
# Concat 레이어를 Fast Normalized Fusion (BiFPN_Concat) 모듈로 교체하고 3차원 Cross-scale 융합을 적용한 모델 설정

nc: 1
scales:
  m: [0.50, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2-P3/8 (Backbone P3)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3 -> P4
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P4/16 (Backbone P4)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4 -> P5
  - [-1, 2, C3k2, [512, True]]         # 6-P5/32 (Backbone P5)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10 (Backbone Top Feature)

head:
  # Top-Down Path (상향식 피처 전달 및 BiFPN Fast Fusion)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, BiFPN_Concat, [1]]             # 12 (BiFPN 가중치 융합: P5 up + Backbone P5 layer 6)
  - [-1, 2, C3k2, [512, False]]                # 13 (Top-down P4)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 2], 1, BiFPN_Concat, [1]]             # 15 (BiFPN 가중치 융합: P4 up + Backbone P3 layer 2)
  - [-1, 2, C3k2, [256, False]]                # 16 (P3/8 Head output - 소형 포트홀 탐지)

  # Bottom-Up Path (하향식 피처 전달 및 BiFPN 3-way Cross-Scale 융합)
  - [-1, 1, Conv, [256, 3, 2]]                  # 17 (P3 output downsample)
  - [[-1, 13, 4], 1, BiFPN_Concat, [1]]         # 18 (BiFPN 3개 노드 가중 융합: P3 down + Top-down P4 + Original Backbone P4 layer 4)
  - [-1, 2, C3k2, [512, False]]                # 19 (P4/16 Head output - 중형 포트홀 탐지)
  - [-1, 1, Conv, [512, 3, 2]]                  # 20 (P4 output downsample)
  - [[-1, 10], 1, BiFPN_Concat, [1]]            # 21 (BiFPN 가중치 융합: P4 down + Top P5 layer 10)
  - [-1, 2, C3k2, [1024, True]]                 # 22 (P5/32 Head output - 대형 포트홀 탐지)
  - [[16, 19, 22], 1, Detect, [nc]]             # 23 Detect
