# ROVOROAD Pothole Detection - Baseline Model Config (YOLO11m)
# 포트홀 단일 클래스 탐지를 위한 YOLO11m 베이스라인 모델 설정

nc: 1 # 단일 클래스 (pothole)
scales:
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2-P3/8
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8 -> P4/16
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P4/16
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16 -> P5/32
  - [-1, 2, C3k2, [512, True]]         # 6-P5/32
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32 -> P6
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 2, C3k2, [512, False]]                # 13
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 2, C3k2, [256, False]]                # 16 (P3/8 output)
  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18
  - [-1, 2, C3k2, [512, False]]                # 19 (P4/16 output)
  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21
  - [-1, 2, C3k2, [1024, True]]                 # 22 (P5/32 output)
  - [[16, 19, 22], 1, Detect, [nc]]             # 23 Detect (pothole 1 class)
