# ROVOROAD Pothole Detection - YOLO11m + CBAM + BiFPN Full Model Config
# CBAM Attention과 BiFPN Neck(Fast Normalized Fusion + Cross-scale)이 통합된 최종 개선 모델 설정

nc: 1
scales:
  m: [0.50, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4 (160x160)
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2-P3/8 (80x80)
  - [-1, 1, CBAM, [16, 7]]             # 3-CBAM Attention P3 (80x80)
  - [-1, 1, Conv, [256, 3, 2]]         # 4-P3 -> P4 (40x40)
  - [-1, 2, C3k2, [512, False, 0.25]]   # 5-P4/16 (40x40)
  - [-1, 1, CBAM, [16, 7]]             # 6-CBAM Attention P4 (40x40)
  - [-1, 1, Conv, [512, 3, 2]]         # 7-P4 -> P5 (20x20)
  - [-1, 2, C3k2, [512, True]]         # 8-P5/32 (20x20)
  - [-1, 1, Conv, [1024, 3, 2]]        # 9 (10x10)
  - [-1, 2, C3k2, [1024, True]]        # 10 (10x10)
  - [-1, 1, SPPF, [1024, 5]]           # 11 (10x10)
  - [-1, 2, C2PSA, [1024]]             # 12 (10x10)
  - [-1, 1, CBAM, [16, 7]]             # 13-CBAM Attention P5 Top (10x10)

head:
  # Top-Down Path (상향식 BiFPN Fast Normalized Fusion)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14 (10x10 -> 20x20)
  - [[-1, 8], 1, BiFPN_Concat, [1]]             # 15 (BiFPN 융합: P5 up 20x20 + P5 layer 8 20x20)
  - [-1, 2, C3k2, [512, False]]                # 16 (Top-down P5/P4 intermediate 20x20)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17 (20x20 -> 40x40)
  - [[-1, 6], 1, BiFPN_Concat, [1]]             # 18 (BiFPN 융합: P4 up 40x40 + P4 CBAM layer 6 40x40)
  - [-1, 2, C3k2, [256, False]]                # 19 (Top-down P4 40x40)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20 (40x40 -> 80x80)
  - [[-1, 3], 1, BiFPN_Concat, [1]]             # 21 (BiFPN 융합: P3 up 80x80 + P3 CBAM layer 3 80x80)
  - [-1, 2, C3k2, [256, False]]                # 22 (P3/8 Head output - 80x80 소형 포트홀 탐지)

  # Bottom-Up Path (하향식 BiFPN 3-way Cross-Scale Fusion)
  - [-1, 1, Conv, [256, 3, 2]]                  # 23 (80x80 -> 40x40)
  - [[-1, 19, 6], 1, BiFPN_Concat, [1]]         # 24 (BiFPN 3-way 융합: P3 down 40x40 + Top-down P4 layer 19 40x40 + Backbone P4 CBAM layer 6 40x40)
  - [-1, 2, C3k2, [512, False]]                # 25 (P4/16 Head output - 40x40 중형 포트홀 탐지)
  - [-1, 1, Conv, [512, 3, 2]]                  # 26 (40x40 -> 20x20)
  - [[-1, 16, 13], 1, BiFPN_Concat, [1]]        # 27 (BiFPN 3-way 융합: P4 down 20x20 + Top-down P5 layer 16 20x20 + Backbone P5 CBAM layer 13 10x10->20x20)
  - [-1, 2, C3k2, [1024, True]]                 # 28 (P5/32 Head output - 20x20 대형 포트홀 탐지)
  - [[22, 25, 28], 1, Detect, [nc]]             # 29 Detect
